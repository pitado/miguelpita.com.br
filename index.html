<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f6f3ee" />
  <title>Miguel Pita</title>

  <link rel="stylesheet" href="./style.css?v=3" />
</head>

<body>
  <main class="stage" id="stage">

    <!-- A arte inteira é desenhada aqui pela GPU -->
    <canvas id="webgl" aria-hidden="true"></canvas>

    <!-- Camadas visuais leves -->
    <div class="soft-light" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>

    <!-- Atalhos -->
    <nav class="shortcut-dock" aria-label="Atalhos">
      <a class="shortcut" href="/lab">LAB</a>
      <a class="shortcut" href="/api">API</a>
      <a class="shortcut" href="/work">WORK</a>
      <a class="shortcut" href="/notes">NOTES</a>
      <a class="shortcut" href="/contact">CONTATO</a>
    </nav>

    <!-- Só aparece caso o navegador não suporte WebGL2 -->
    <div class="webgl-fallback" id="fallback" hidden>
      WebGL2 não está disponível neste navegador.
    </div>

  </main>

  <!-- ?v=3 evita carregar um JS antigo que esteja no cache -->
  <script src="./art.js?v=3"></script>
</body>
</html>
